name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed Android Release APK
        run: gradle -p android-app assembleRelease --no-daemon

      - name: Prepare MadhavShivomERP.apk
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk MadhavShivomERP.apk
          ls -lh MadhavShivomERP.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadhavShivomERP-APK
          path: MadhavShivomERP.apk
          retention-days: 90

      - name: Publish Direct Download Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Madhav & Shivom ERP — Android Setup (APK)
          body: |
            ### 📲 Madhav Enterprises & Shivom Sales — Android ERP App
            - **Direct APK Setup File:** Download `MadhavShivomERP.apk` below and tap to install on Android mobile.
            - **Live Sync:** Connected to `https://madhavshivom.vercel.app` & Firebase.
            - **Built-in Support:** Native WhatsApp sharing, Print/PDF Invoices & Receipts, Excel Backup to Downloads.
          files: MadhavShivomERP.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
