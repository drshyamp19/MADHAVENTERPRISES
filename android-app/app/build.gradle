plugins {
    id 'com.android.application'
}

android {
    namespace 'com.madhavshivom.erp'
    compileSdk 34

    defaultConfig {
        applicationId "com.madhavshivom.erp"
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName "2.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
